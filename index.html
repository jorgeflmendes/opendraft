<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <meta property="og:title" content="OpenDraft — Local-first LaTeX editor" />

      property="og:description"
      content="Write, compile and review technical documents in one precise browser workspace."

    <meta name="twitter:title" content="OpenDraft — Local-first LaTeX editor" />

      name="twitter:description"
      content="Write, compile and review technical documents in one precise browser workspace."
    />

    <script src="/theme-init.js"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
